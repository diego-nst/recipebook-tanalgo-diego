{% extends 'base.html' %}

{% block title %}Recipe Book{% endblock %}
{% block header %}List View{% endblock %}
{% block content %}
	<ol>{% for recipe in recipe_list %}
        <li><a href="{{recipe.get_absolute_url}}">{{recipe.name}}</a></li>
	{% endfor %}</ol>
	<button><a href="/recipe/add">Add Recipe</a></button>
{% endblock %}
