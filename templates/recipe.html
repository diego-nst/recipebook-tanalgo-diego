<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>{% block title %}Recipe Book{% endblock %}</title>
	{% block styles %}
	{% endblock %}
    <h1>Recipe Book</h1>
</head>
<body>
	{% block content %}
    <p>{{recipe.name}}:</p>
    <ol>{% for ingredient in recipe.ingredients.all %}
		<li>{{ingredient.ingredient.name}} - {{ingredient.quantity}}</li>
    {% endfor %}</ol>
	{% endblock %}
</body>
</html>
